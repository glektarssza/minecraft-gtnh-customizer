# yaml-language-server: $schema=https://json.schemastore.org/pre-commit-config.json
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude_types: [batch]
      - id: mixed-line-ending
        args: [--fix=crlf]
        types: [batch]
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: gradle-check
        name: Run linting checks via Gradle
        types_or: [java]
        language: system
        entry: ./gradlew --console plain check
        pass_filenames: false
        verbose: true
        stages:
          - pre-commit
          - pre-push
      - id: gradle-test
        name: Run tests via Gradle
        types_or: [java]
        language: system
        entry: ./gradlew --console plain test
        pass_filenames: false
        verbose: true
        stages:
          - pre-push
      - id: spell-check
        name: Run spell checking via CSpell
        language: system
        types_or: [text]
        pass_filenames: false
        entry: |
          pnpx cspell lint \
            --no-color \
            --no-must-find-files \
            --no-progress \
            --no-cache .
